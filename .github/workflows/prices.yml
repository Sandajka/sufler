name: prices
on:
  schedule:
    - cron: "6,8,11,15,22,32,45 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prices
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read prices
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          PRICE_CHANNEL: ${{ vars.PRICE_CHANNEL }}
        shell: bash
        run: |
          cat > collect.py <<'PYEOF'
          # Забирает прайсы скупщиков из канала Discord и пишет feed.json для всех Суфлёров.
          # Токен приходит из секрета GitHub и никуда не печатается; в файл попадают только сообщения с ценами.
          import json, os, re, sys, urllib.request, urllib.error

          PRICE = re.compile(r":\s*\$\s*\d")

          def text_of(m):
              parts = [m.get("content") or ""]
              for e in m.get("embeds") or []:
                  parts += [e.get("title") or "", e.get("description") or ""]
                  parts += [(f.get("name") or "") + ": " + (f.get("value") or "") for f in e.get("fields") or []]
              return "\n".join(parts)

          def clean(messages):
              out = []
              for m in messages:
                  # Только пересланные прайсы (webhook): личные сообщения людей из канала наружу не выкладываем
                  if not m.get("webhook_id") or not PRICE.search(text_of(m)):
                      continue
                  out.append({
                      "id": m["id"], "timestamp": m["timestamp"], "content": m.get("content") or "",
                      "author": {"username": (m.get("author") or {}).get("username") or ""},
                      "embeds": [{"title": e.get("title"), "description": e.get("description"),
                                  "fields": [{"name": f.get("name"), "value": f.get("value")} for f in e.get("fields") or []]}
                                 for e in m.get("embeds") or []],
                  })
              return out

          def main():
              token, channel = os.environ.get("DISCORD_TOKEN", "").strip(), os.environ.get("PRICE_CHANNEL", "").strip()
              if not token or not re.fullmatch(r"\d{15,22}", channel):
                  sys.exit("Нет секрета DISCORD_TOKEN или PRICE_CHANNEL")
              req = urllib.request.Request("https://discord.com/api/v10/channels/%s/messages?limit=100" % channel,
                                           headers={"Authorization": "Bot " + token, "User-Agent": "DiscordBot (https://localhost, 1.0)"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      messages = json.load(r)
              except urllib.error.HTTPError as e:
                  sys.exit("Discord ответил ошибкой %d%s" % (e.code, " — токен сброшен, вставь новый в секрет" if e.code == 401 else ""))
              feed = clean(messages)
              if not feed:
                  sys.exit("В канале нет прайсов — старый файл не трогаем")
              with open("feed.json", "w", encoding="utf-8") as f:
                  json.dump(feed, f, ensure_ascii=False, separators=(",", ":"))
              print("прайсов:", len(feed), "последний:", feed[0]["timestamp"])

          if __name__ == "__main__":
              main()
          PYEOF
          python3 collect.py
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          API: repos/${{ github.repository }}/contents/prices.json
        shell: bash
        run: |
          new=$(git hash-object feed.json)
          old=$(gh api "$API" --jq .sha 2>/dev/null) || old=""
          if [ "$new" = "$old" ]; then echo "без изменений"; exit 0; fi
          jq -n --rawfile c feed.json --arg s "$old" '{message:"prices", content:($c|@base64)} + (if $s=="" then {} else {sha:$s} end)' > body.json
          gh api -X PUT "$API" --input body.json --silent
